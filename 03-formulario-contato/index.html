<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>Tech Academy | Formulário de Matrícula</title>
</head>

<body>
    <main>
        <form action="">
            <h1>Formulário de Matrícula</h1>
            <p>Preencha  seus dados para iniciar sua jornada na programação</p>

            <label for="name">Nome completo:</label>
            <input id="name" type="text" name="userName" placeholder="Digite seu nome completo" required> 

            <label for="email">E-mail:</label>
            <input id="email" type="email" name="userEmail" placeholder="Digite seu e-mail" required>

            <label for="phone">Telefone</label>
            <input id="phone" type="tel" name="userPhone" maxlength="15" placeholder="(00) 00000-0000" required>

            <label for="course">Curso de interesse:</label>
            <select name="userCourse" id="course" required>
                <option value="" disabled selected>Selecione</option>
                <option value="front">Front-End</option>
                <option value="back">Back-End</option>
                <option value="full">FullStack</option>
            </select>

            <label for="message">Mensagem:</label>
            <textarea name="userMessage" id="message" placeholder="Conte um pouco sobre você e seus objetivos..."></textarea>

            <button type="submit">Enviar inscrição</button>
        </form>
    </main>   
</body>

</html>
