<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Academy | Formulário de Matrícula</title>
</head>

<body>
    <main>
        <form action="">
            <h1>Formulário de Matrícula</h1>
            <p>Preencha  seus dados para iniciar sua jornada na programação</p>

            <label for="name">Nome completo:</label> <br>
            <input id="name" type="text" name="userName" placeholder="Digite seu nome completo" required> <br> 

            <label for="email">E-mail:</label> <br>
            <input id="email" type="email" name="userEmail" placeholder="Digite seu e-mail" required> <br> 

            <label for="phone">Telefone</label> <br>
            <input id="phone" type="tel" name="userPhone" maxlength="15" placeholder="(00) 00000-0000" required> <br> 

            <label for="course">Curso de interesse:</label> <br>
            <select name="userCourse" id="course" required>
                <option value="" disabled selected>Selecione</option>
                <option value="front">Front-End</option>
                <option value="back">Back-End</option>
                <option value="full">FullStack</option>
            </select> <br> <br>

            <label for="message">Mensagem:</label> <br>
            <textarea name="userMessage" id="message" placeholder="Conte um pouco sobre você e seus objetivos..."></textarea> <br>

            <button type="submit">Enviar inscrição</button>
        </form>
    </main>   
</body>

</html>
